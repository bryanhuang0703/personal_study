<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: instrument-panel field manual. Left-aligned header strip with a frame-count readout, tab rail, content column ~920px. */
:root{
  --bg:#ECEFEE; --panel:#F8FAF9; --ink:#15201E; --muted:#5A6865; --line:#CBD3D1;
  --accent:#B85C00; --accent-soft:#F6E3CF; --ok:#2F7A4F; --ok-soft:#DCEFE3; --bad:#B03A2E; --bad-soft:#F6DEDA;
  --f-display:"Archivo","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --panel:#18211F; --ink:#E4ECE9; --muted:#93A39F; --line:#2C3835;
  --accent:#F0A04B; --accent-soft:#3A2A17; --ok:#6CC08E; --ok-soft:#1C3326; --bad:#EC8277; --bad-soft:#3B201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --panel:#18211F; --ink:#E4ECE9; --muted:#93A39F; --line:#2C3835;
  --accent:#F0A04B; --accent-soft:#3A2A17; --ok:#6CC08E; --ok-soft:#1C3326; --bad:#EC8277; --bad-soft:#3B201D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.5vw,38px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.readout b{display:block;font-size:24px;color:var(--accent);font-weight:600}
.lede{color:var(--muted);max-width:66ch;margin:0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font-family:var(--f-display);font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:4px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px}
input[type=search]{flex:1 1 220px;min-width:0}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.term{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.term .en{font-family:var(--f-mono);font-weight:600;font-size:15px}
.term .zh{font-weight:700;margin-left:8px}
.term .cat{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.term p{margin:4px 0 0;max-width:72ch}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;margin-top:8px}
.pair p{margin:2px 0 0}
.pair [lang="en"] p{font-size:14px}
.why-pair p{color:var(--muted);font-size:14px}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab.acc{color:var(--accent)}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.term .body{min-width:0;grid-column:1}
.mark{align-self:start;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:4px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.mark[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);padding:24px 0}
details.qa{border:1px solid var(--line);background:var(--panel);border-radius:4px}
details.qa+details.qa{margin-top:8px}
details.qa summary{cursor:pointer;padding:14px 16px;list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
details.qa summary::-webkit-details-marker{display:none}
.qn{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}
.qzh{font-weight:700}
.qen{grid-column:2;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qbody{padding:0 16px 16px 16px;display:grid;gap:10px}
.qbody div{border-left:3px solid var(--line);padding-left:12px}
.qbody h4{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qbody p{margin:2px 0 0}
.qbody .good{border-color:var(--ok)} .qbody .good h4{color:var(--ok)}
.qbody .flag{border-color:var(--bad)} .qbody .flag h4{color:var(--bad)}
.group-h{font-family:var(--f-display);font-weight:700;font-size:18px;margin:18px 0 8px}
.note{background:var(--accent-soft);border-radius:4px;padding:12px 16px;font-size:14px}
.note b{color:var(--accent)}
/* flashcards */
.card-wrap{perspective:1200px;max-width:620px;width:100%;margin:0 auto}
.card{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,4vw,28px);line-height:1.25;overflow-wrap:anywhere}
.face .hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font-family:var(--f-display);font-weight:700;font-size:14px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:4px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.counter{text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* quiz */
.qz{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qz .prompt{font-size:16px;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;font:inherit;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:4px;cursor:pointer;overflow-wrap:anywhere}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.explain{font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
@media (max-width:520px){.term{grid-template-columns:1fr}.mark{justify-self:start}.card{height:340px}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Project TA · CTO technical sync prep</div>
      <h1>具身数据采集 Kit 术语与问答</h1>
    </div>
    <div class="readout" aria-live="polite"><b id="masteredCount">0 / 0</b>已掌握术语</div>
  </header>
  <p class="lede">围绕 Thoth 第一人称采集设备（headset + 云台双目 + AR 眼镜 + 腰部计算单元）整理。先看术语，再用问答准备和 Pedro 的对话，最后用闪卡和测验巩固。“已掌握”状态保存在本浏览器。</p>

  <nav role="tablist" aria-label="模块">
    <button role="tab" aria-selected="true" data-tab="glossary" id="tab-glossary">术语表</button>
    <button role="tab" aria-selected="false" data-tab="qa" id="tab-qa">CTO 问答</button>
    <button role="tab" aria-selected="false" data-tab="cards" id="tab-cards">闪卡</button>
    <button role="tab" aria-selected="false" data-tab="quiz" id="tab-quiz">测验</button>
  </nav>

  <section id="glossary" role="tabpanel">
    <div class="tools">
      <input type="search" id="q" placeholder="搜索英文、中文或缩写，例如 extrinsics、回差" aria-label="搜索术语">
      <select id="masterFilter" aria-label="掌握状态">
        <option value="all">全部</option><option value="todo">未掌握</option><option value="done">已掌握</option>
      </select>
    </div>
    <div class="tools" id="cats" style="margin-top:10px"></div>
    <div class="list" id="termList" style="margin-top:12px"></div>
  </section>

  <section id="qa" role="tabpanel" hidden>
    <div class="note"><b>姿态建议：</b>以“帮你把原型变成可以批量交付的产品”为出发点，用提问代替评判。每题展开后有三部分：为什么问、好的回答通常包含什么、需要警惕的信号。</div>
    <div id="qaList"></div>
  </section>

  <section id="cards" role="tabpanel" hidden>
    <div class="tools" style="justify-content:center;margin-bottom:12px">
      <select id="cardSet" aria-label="闪卡范围"></select>
      <select id="cardDir" aria-label="闪卡方向">
        <option value="en">正面英文 → 背面中文</option><option value="zh">正面中文 → 背面英文</option>
      </select>
    </div>
    <div class="card-wrap">
      <div class="card" id="card" tabindex="0" role="button" aria-label="点击翻面">
        <div class="face front"><div class="hint" id="cFrontHint"></div><div class="big" id="cFront"></div><div class="hint">点击或按空格翻面</div></div>
        <div class="face back"><div class="hint" id="cBackHint"></div><div class="big" id="cBack" style="font-size:22px"></div><p id="cDef" style="margin:0"></p></div>
      </div>
    </div>
    <div class="counter" id="cCount" style="margin:12px 0"></div>
    <div class="row">
      <button class="btn" id="cPrev">上一张</button>
      <button class="btn" id="cShuffle">打乱</button>
      <button class="btn ok" id="cKnow">已掌握</button>
      <button class="btn primary" id="cNext">下一张</button>
    </div>
  </section>

  <section id="quiz" role="tabpanel" hidden>
    <div class="qz" id="qz"></div>
  </section>
</div>

<script>
const CATS={
 route:"数据路线 Data routes", img:"成像 Imaging", cal:"标定与位姿 Calibration", hand:"手部与动作 Hands & action",
 obj:"物体与场景 Objects & scene", sim:"仿真 Simulation", hw:"硬件与量产 Hardware & production", data:"交付与质量 Delivery & QA"
};
const T=[
// route
["route","Egocentric data","第一人称数据","","采集者头戴相机，从自己眼睛的视角记录双手完成任务的视频。","Thoth 的核心路线：成本低、易规模化，适合用他们的人力网络在多国铺开。"],
["route","Teleoperation","遥操作","teleop","人通过手柄、VR 或主从臂直接操控真实机器人完成任务，记录下机器人自己的观测和动作。","数据质量最高但最贵。deck 第 14 页闭环的最后一步就是遥操作收尾。"],
["route","UMI (Universal Manipulation Interface)","手持通用操作采集器","UMI","人手持一个与机器人夹爪结构相同的工具来操作，同时记录腕部视角和夹爪开合。","动作空间与夹爪机器人天然对齐，是 Ego 路线的直接竞争方案。"],
["route","Embodiment gap","本体差异","","人和机器人在身体结构、手的形态、视角高度上的差别，导致人类数据不能直接用于机器人。","买方最关心的问题之一，决定 Ego 数据的实际价值。"],
["route","Observation / Action","观测 / 动作","obs / act","机器人学习的一对基本数据：在某个时刻看到了什么（图像、状态），以及做了什么动作。","Ego 视频天然只有 observation，action 需要从手部姿态推算。"],
["route","Policy","策略模型","","输入观测、输出动作的模型，就是机器人最终运行的“大脑”。","deck 里“task and robot in, trained policy out”指的就是训练这个。"],
["route","VLA (Vision-Language-Action)","视觉语言动作模型","VLA","同时理解图像和语言指令并直接输出机器人动作的大模型，是当前具身智能主流方向。","VLA 预训练需要海量、多样的数据，是 Ego 数据的主要买方需求来源。"],
["route","Imitation learning / Behavior cloning","模仿学习 / 行为克隆","BC","让模型学习复现示范者的动作，是使用人类示范数据训练机器人的基本方法。","数据中示范是否一致、是否有犹豫和错误动作，直接影响学习效果。"],
["route","Episode / Take","采集片段","","一次完整任务从开始到结束的录制单位，通常是数据计价和质检的基本单位。","问清楚按 episode 计价还是按有效小时计价。"],
// img
["img","Exposure time","曝光时间","","传感器每帧接收光线的时长。越短，运动模糊越小，画面越暗。","deck 从 16.7 ms 降到 4 ms，清晰度提升 2.7 倍。"],
["img","Gain / ISO","增益","","对传感器信号的放大倍数，用来补偿短曝光造成的亮度不足，代价是噪点增加。","短曝光 + 自动增益是他们的方案，需关注暗光场景的噪点。"],
["img","Motion blur","运动模糊","","物体在曝光期间移动导致的拖影。手部动作快，最容易出现。","模糊会让手部关键点估计失败，是废片的主因之一。"],
["img","Rolling shutter","卷帘快门","","传感器逐行依次曝光。快速运动时画面会倾斜、扭曲（果冻效应）。","便宜常见，但对快速手部动作和 3D 重建不友好。"],
["img","Global shutter","全局快门","","整个传感器同一时刻曝光，快速运动不变形。","更适合采集手部操作，成本更高、像素通常更低。"],
["img","Dynamic range / Clipping","动态范围 / 过曝裁切","HDR","传感器能同时记录亮部和暗部的能力。超出上限的像素变成纯白，即 clipped。","deck 里 clipped 比例从 10.96% 降到 4.90%。窗边、灯下场景是难点。"],
["img","FOV / Fisheye","视场角 / 鱼眼镜头","FOV","相机能看到的角度范围。鱼眼镜头 FOV 可达 150° 以上，但边缘畸变大。","云台追手的替代方案：用固定大 FOV 镜头保证手不出画。"],
["img","Stereo camera / Baseline","双目相机 / 基线","","两个相机并排拍摄，通过视差计算深度。两镜头间距叫基线，基线越大远处深度越准。","手部操作在 0.3 到 0.8 米，基线需要针对近距离优化。"],
["img","Frame drop","丢帧","","录制过程中部分帧没有被保存，时间序列出现断档。","丢帧会破坏动作的连续性，deck 用两台计算单元 + 有线链路解决。"],
["img","GMSL / MIPI CSI-2","车规串行链路 / 相机接口","GMSL","MIPI CSI-2 是相机到处理器的标准接口；GMSL 用同轴线把它延长到数米，带宽稳定、抗干扰。","deck 说“wired camera link, not USB”，大概率是这一类，代价是头到腰的线缆。"],
// cal
["cal","Intrinsics","内参","K","相机自身的焦距、主点、畸变系数，描述 3D 点如何投影到图像上。","每台设备出厂需标定，量产时要有自动化标定工位。"],
["cal","Extrinsics","外参","[R|t]","相机相对于另一个参考系（另一个相机、IMU、头部）的旋转和平移。","云台让外参随时间变化，这是精度风险的核心来源。"],
["cal","Hand-eye calibration","手眼标定","","求解相机与运动机构（机械臂、云台）之间固定安装关系的标定方法。","带云台的设备需要做这一步，而且要能在产线批量完成。"],
["cal","Time synchronization","时间同步","sync","让相机、IMU、编码器等多个传感器的数据时间戳对齐。硬件触发比软件时间戳更精确。","手速 1 m/s 时，5 ms 不同步就是 5 mm 误差。"],
["cal","Hardware trigger / PTP","硬件触发 / 精确时间协议","PTP","用电信号同时触发多个传感器采集，或用 PTP 协议在网络上对齐时钟到微秒级。","问云台角度和图像是否用硬件信号对齐。"],
["cal","SLAM / VIO","同步定位与建图 / 视觉惯性里程计","VIO","通过相机和 IMU 实时估计设备在空间中的位置和朝向。","要把手放到世界坐标系里，必须先知道头在哪里。"],
["cal","IMU","惯性测量单元","IMU","测量加速度和角速度的传感器，用来估计运动和朝向。","IMU 与相机的外参和时间偏移都需要标定。"],
["cal","Encoder / Backlash","编码器 / 机械回差","","编码器读取电机转角；回差是齿轮换向时的空转间隙，会让读数和实际角度不一致。","云台精度的关键：编码器分辨率和回差决定外参误差。"],
["cal","Gimbal / Pan-tilt","云台 / 水平俯仰机构","","可以水平（pan）和俯仰（tilt）转动相机的机构。","Thoth 的差异化设计，也是主要工程风险。"],
["cal","Transform chain","坐标变换链","TF","多个坐标系之间的变换依次相乘，例如 世界→头→云台→相机→手。","链上任何一环有误差都会传到最终的手部 3D 位置。"],
// hand
["hand","Hand pose estimation","手部姿态估计","","从图像中估计手的关节位置，常用 21 个关键点表示一只手。","3D 手部数据是 Ego 数据的核心产出，精度如何验证要问清楚。"],
["hand","MANO","参数化手部模型","MANO","学术界标准的手部 3D 模型，用少量参数描述手的形状和姿态。","交付格式是否支持 MANO 参数，是数据兼容性问题。"],
["hand","Retargeting","动作重定向","","把人手的动作映射到形态不同的机器人手上。","人手 20 多个自由度，夹爪可能只有 1 个，映射会丢信息。"],

  ["哪些部件已经确定供应商？哪些还是开发板或 3D 打印件？","Which parts have committed suppliers, and which are still dev boards or 3D prints?","判断从原型到量产的工作量。","有清单，并知道哪些需要开模或定制 PCB。","全部未定，但时间表写着几个月内量产。"]
 ]],
 ["数据质量与交付",[
  ["目前实际的有效率和人均日产出是多少？","What is the real usable rate and per-collector daily output today?","这是商业模型的核心，也是硬件改进的衡量标准。","有按问题类型拆分的废片原因统计。","只有理论值，或从未统计过。"],
  ["交付格式是什么？支持 MCAP、HDF5、LeRobot 吗？","What delivery formats do you support: MCAP, HDF5, LeRobot?","格式不匹配会增加客户的接入成本。","有标准 schema 文档和样例数据集。","每个客户临时转换格式。"],
  ["在家庭等真实场景采集时，如何处理隐私和去标识化？","How do you handle privacy and de-identification in real home scenes?","多国采集涉及不同隐私法规，影响能否交付。","有自动人脸、屏幕模糊流程和采集同意书。","没考虑过。"]
 ]]
];
// ---------- state ----------
let mastered=new Set();
try{const s=localStorage.getItem("ta-mastered");if(s)mastered=new Set(JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("ta-mastered",JSON.stringify([...mastered]))}catch(e){}updateCount()};
const key=t=>t[1];
function updateCount(){document.getElementById("masteredCount").textContent=mastered.size+" / "+T.length}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ---------- tabs ----------
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("[role=tabpanel]").forEach(p=>p.hidden=p.id!==b.dataset.tab);
  if(b.dataset.tab==="quiz"&&!quizState)startQuiz();
}));
// ---------- glossary ----------
let activeCat="all";
const catBox=document.getElementById("cats");
[["all","全部"],...Object.entries(CATS)].forEach(([k,v])=>{
  const c=document.createElement("button");c.className="chip";c.textContent=v;c.setAttribute("aria-pressed",k==="all");
  c.onclick=()=>{activeCat=k;catBox.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));renderTerms()};
  catBox.appendChild(c);
});
function renderTerms(){
  const q=document.getElementById("q").value.trim().toLowerCase(), mf=document.getElementById("masterFilter").value;
  const list=T.filter(t=>(activeCat==="all"||t[0]===activeCat)
    &&(!q||(t[1]+t[2]+t[3]+t[4]+EN[T.indexOf(t)][0]).toLowerCase().includes(q))
    &&(mf==="all"||(mf==="done")===mastered.has(key(t))));
  const box=document.getElementById("termList");
  box.innerHTML=list.length?list.map(t=>`<div class="term"><div class="body"><div class="cat">${esc(CATS[t[0]])}${t[3]?" · "+esc(t[3]):""}</div>
  <div><span class="en">${esc(t[1])}</span><span class="zh">${esc(t[2])}</span></div>
  <div class="pair"><div><div class="lab">释义</div><p>${esc(t[4])}</p></div><div lang="en"><div class="lab">Definition</div><p>${esc(EN[T.indexOf(t)][0])}</p></div></div>
  <div class="pair why-pair"><div><div class="lab acc">对 Thoth 的意义</div><p>${esc(t[5])}</p></div><div lang="en"><div class="lab acc">Why it matters for Thoth</div><p>${esc(EN[T.indexOf(t)][1])}</p></div></div></div>
  <button class="mark" data-k="${esc(t[1])}" aria-pressed="${mastered.has(key(t))}">${mastered.has(key(t))?"已掌握":"标记掌握"}</button></div>`).join("")
  :`<div class="empty">没有匹配的术语。换个关键词或清除筛选。</div>`;
  box.querySelectorAll(".mark").forEach(b=>b.onclick=()=>{const k=b.dataset.k;mastered.has(k)?mastered.delete(k):mastered.add(k);save();renderTerms()});
}
document.getElementById("q").addEventListener("input",renderTerms);
document.getElementById("masterFilter").addEventListener("change",renderTerms);
// ---------- QA ----------
let n=0;
document.getElementById("qaList").innerHTML=QA.map(([g,items])=>`<h3 class="group-h">${esc(g)}</h3>`+items.map(i=>{n++;return `<details class="qa"><summary><span class="qn">Q${String(n).padStart(2,"0")}</span><span class="qzh">${esc(i[0])}</span><span class="qen">${esc(i[1])}</span></summary>
<div class="qbody"><div><h4>为什么问 · Why ask</h4><p>${esc(i[2])}</p></div><div class="good"><h4>好的回答 · Good answer</h4><p>${esc(i[3])}</p></div><div class="flag"><h4>警惕信号 · Red flag</h4><p>${esc(i[4])}</p></div></div></details>`}).join("")).join("");
// ---------- flashcards ----------
const setSel=document.getElementById("cardSet");
setSel.innerHTML=`<option value="all">全部术语</option><option value="todo">仅未掌握</option>`+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
let deck=[],ci=0;
function buildDeck(){const v=setSel.value;deck=T.filter(t=>v==="all"||(v==="todo"?!mastered.has(key(t)):t[0]===v));ci=0;showCard()}
function showCard(){
  const card=document.getElementById("card");card.classList.remove("flip");
  if(!deck.length){document.getElementById("cFront").textContent="这一组都掌握了";document.getElementById("cFrontHint").textContent="";document.getElementById("cCount").textContent="0 / 0";return}
  const t=deck[ci],en=document.getElementById("cardDir").value==="en";
  document.getElementById("cFrontHint").textContent=CATS[t[0]];
  document.getElementById("cFront").textContent=en?t[1]+(t[3]?"  ("+t[3]+")":""):t[2];
  document.getElementById("cBackHint").textContent=en?"中文":"English";
  document.getElementById("cBack").textContent=en?t[2]:t[1];
  document.getElementById("cDef").innerHTML=esc(t[4])+'<br><span lang="en" style="color:var(--muted);font-size:14px">'+esc(EN[T.indexOf(t)][0])+'</span>';
  document.getElementById("cCount").textContent=(ci+1)+" / "+deck.length+(mastered.has(key(t))?" · 已掌握":"");
}
const flip=()=>document.getElementById("card").classList.toggle("flip");
document.getElementById("card").addEventListener("click",flip);
document.getElementById("card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
document.getElementById("cNext").onclick=()=>{if(deck.length){ci=(ci+1)%deck.length;showCard()}};
document.getElementById("cPrev").onclick=()=>{if(deck.length){ci=(ci-1+deck.length)%deck.length;showCard()}};
document.getElementById("cShuffle").onclick=()=>{deck.sort(()=>Math.random()-.5);ci=0;showCard()};
document.getElementById("cKnow").onclick=()=>{if(!deck.length)return;mastered.add(key(deck[ci]));save();renderTerms();ci=(ci+1)%deck.length;showCard()};
setSel.onchange=buildDeck;document.getElementById("cardDir").onchange=showCard;
// ---------- quiz ----------
let quizState=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(){
  const qs=shuffle(T).slice(0,10).map((t,i)=>{
    const mode=i%2; // 0: def -> term ; 1: en -> zh
    const pool=shuffle(T.filter(x=>x!==t&&x[0]===t[0])).concat(shuffle(T.filter(x=>x[0]!==t[0])));
    const opts=shuffle([t,...pool.slice(0,3)]);
    return {t,mode,opts};
  });
  quizState={qs,i:0,score:0};renderQuiz();
}
function renderQuiz(){
  const box=document.getElementById("qz"),s=quizState;
  if(s.i>=s.qs.length){
    box.innerHTML=`<div class="eyebrow">测验完成</div><div class="prompt" style="font-size:22px;font-family:var(--f-display);font-weight:800">${s.score} / ${s.qs.length}</div>
    <p class="explain">${s.score>=8?"基础术语已经熟悉，可以重点准备 CTO 问答。":"建议回到术语表，用“未掌握”筛选再复习一轮。"}答对的题已自动标记为已掌握。</p><div class="row" style="justify-content:flex-start"><button class="btn primary" id="again">再来 10 题</button></div>`;
    document.getElementById("again").onclick=startQuiz;return;
  }
  const {t,mode,opts}=s.qs[s.i];
  const prompt=mode===0?`哪个术语符合这个描述？<br><span style="color:var(--muted)">${esc(t[4])}</span>`:`<span style="font-family:var(--f-mono)">${esc(t[1])}</span> 的中文是？`;
  box.innerHTML=`<div class="bar"><i style="width:${s.i/s.qs.length*100}%"></i></div>
  <div class="eyebrow">第 ${s.i+1} / ${s.qs.length} 题 · ${esc(CATS[t[0]])}</div><div class="prompt">${prompt}</div>
  <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(mode===0?o[1]:o[2])}</button>`).join("")}</div>
  <div class="explain" id="exp" aria-live="polite"></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const pick=opts[+b.dataset.j],ok=pick===t;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.j]===t)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");else{s.score++;mastered.add(key(t));save();renderTerms()}
    document.getElementById("exp").innerHTML=`${ok?"正确。":"不对。"}<b>${esc(t[1])}</b> ${esc(t[2])}：${esc(t[5])}<br><span lang="en">${esc(EN[T.indexOf(t)][1])}</span>
    <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" id="nx">${s.i+1<s.qs.length?"下一题":"看结果"}</button></div>`;
    document.getElementById("nx").onclick=()=>{s.i++;renderQuiz()};document.getElementById("nx").focus();
  });
}
updateCount();renderTerms();buildDeck();
</script>

</body></html>
